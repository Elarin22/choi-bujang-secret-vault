<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 서버 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    input, textarea, button { font: inherit; padding: 8px; margin: 6px; }
    label { display: block; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 서버 자료실</div>
    <p><a href="/connect.html">내 기기 승인 상태 확인</a></p>
    <h1>내 자료실</h1>
    <p>실습용 가상 메모만 사용하세요. 로그인해야 자료를 읽고 쓸 수 있습니다.</p>
    <form id="login" hidden>
      <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
    <p id="status" role="status">기기 승인 상태를 확인하는 중입니다. 승인 전에는 자료를 요청하지 않습니다.</p>
    <button id="logout" hidden>로그아웃</button>
    <section id="workspace" hidden>
      <form id="editor">
        <label>제목 <input id="title" maxlength="200" required></label>
        <label>가상 메모 <textarea id="body" maxlength="10000" required></textarea></label>
        <button type="submit" id="save">메모 추가</button>
        <button type="button" id="cancel" hidden>수정 취소</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
    <div class="notice">과거 공개 커밋·배포에는 이전 가상 자료가 남을 수 있습니다. 최신 파일의 제거가 과거 노출을 회수하지는 않습니다.</div>
    <p>검증한 계정의 메모만 읽고 추가·수정·삭제할 수 있습니다. 다른 계정의 자료 요청은 거부합니다.</p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
